name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OPALSTACK_HOST }}
          username: ${{ secrets.OPALSTACK_USER }}
          password: ${{ secrets.OPAL_PASSWORD }}
          port: 22
          script: |
            set -e
            export PATH="/opt/nodejs20/bin:$PATH"
            cd "/home/aog/apps/aog/AOG Events"

            echo "── Pulling latest code ──"
            git fetch origin
            git reset --hard origin/main

            echo "── Installing dependencies ──"
            npm ci

            echo "── Building ──"
            npm run build

            echo "── Restarting app ──"
            bash ~/apps/aog/stop
            bash ~/apps/aog/start

            echo "── Done ──"
